<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghostdiedie WebSocket Test</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #eee; padding: 20px; }
        h1 { color: #00ff88; }
        .section { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; }
        label { display: block; margin: 8px 0 4px; color: #aaa; }
        input, select { padding: 8px; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; width: 200px; }
        button { padding: 8px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-create { background: #00ff88; color: #000; }
        .btn-join { background: #00aaff; color: #000; }
        .btn-send { background: #ff8800; color: #000; }
        .btn-disconnect { background: #ff4444; color: #fff; }
        #log { background: #111; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; }
        .msg-sent { color: #00ff88; }
        .msg-received { color: #00aaff; }
        .msg-system { color: #ff8800; }
        .msg-error { color: #ff4444; }
    </style>
</head>
<body>
    <h1>Ghostdiedie WebSocket Test</h1>

    <div class="section">
        <h3>1. Create or Join a Room</h3>
        <label>API URL</label>
        <input id="apiUrl" value="https://api.ghostdiedie.club" style="width:300px">
        <label>API Key</label>
        <input id="apiKey" value="REMOVED_EXPOSED_API_KEY" style="width:400px">
        <label>Player Name</label>
        <input id="playerName" value="Player1">
        <label>Character ID (1-5)</label>
        <input id="characterId" type="number" value="1" min="1" max="5">
        <br><br>
        <button class="btn-create" onclick="createRoom()">Create Room</button>
        <label>Room Code</label>
        <input id="roomCode" placeholder="ABCD">
        <button class="btn-join" onclick="joinRoom()">Join Room</button>
    </div>

    <div class="section">
        <h3>2. Connect WebSocket</h3>
        <button class="btn-join" onclick="connectWS()">Connect WebSocket</button>
        <button class="btn-disconnect" onclick="disconnectWS()">Disconnect</button>
    </div>

    <div class="section">
        <h3>3. Send Messages</h3>
        <button class="btn-send" onclick="sendAction('move', {x: 100, y: 50})">Move (100, 50)</button>
        <button class="btn-send" onclick="sendAction('attack', {damage: 15})">Attack (15)</button>
        <button class="btn-send" onclick="sendAction('block', {})">Block</button>
        <br><br>
        <label>Custom JSON</label>
        <input id="customMsg" style="width:400px" value='{"type":"attack","damage":20}'>
        <button class="btn-send" onclick="sendCustom()">Send</button>
    </div>

    <h3>Log</h3>
    <div id="log"></div>

<script>
    let ws = null;

    function log(msg, cls = 'msg-system') {
        const el = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        el.innerHTML += `<span class="${cls}">[${time}] ${msg}</span>\n`;
        el.scrollTop = el.scrollHeight;
    }

    function getHeaders() {
        return { 'Content-Type': 'application/json', 'X-API-Key': document.getElementById('apiKey').value };
    }

    async function createRoom() {
        const url = document.getElementById('apiUrl').value;
        try {
            const res = await fetch(`${url}/api/rooms`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({
                    player_name: document.getElementById('playerName').value,
                    character_id: parseInt(document.getElementById('characterId').value),
                }),
            });
            const data = await res.json();
            if (data.room_code) {
                document.getElementById('roomCode').value = data.room_code;
                log(`Room created. Code: ${data.room_code}`);
            } else {
                log(`Error: ${JSON.stringify(data)}`, 'msg-error');
            }
        } catch (e) {
            log(`Error: ${e.message}`, 'msg-error');
        }
    }

    async function joinRoom() {
        const url = document.getElementById('apiUrl').value;
        const code = document.getElementById('roomCode').value;
        try {
            const res = await fetch(`${url}/api/rooms/${code}/join`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({
                    player_name: document.getElementById('playerName').value,
                    character_id: parseInt(document.getElementById('characterId').value),
                }),
            });
            const data = await res.json();
            log(`Joined room: ${JSON.stringify(data)}`);
        } catch (e) {
            log(`Error: ${e.message}`, 'msg-error');
        }
    }

    function connectWS() {
        const code = document.getElementById('roomCode').value;
        const httpUrl = document.getElementById('apiUrl').value;
        const wsUrl = httpUrl.replace('https://', 'wss://').replace('http://', 'ws://');

        ws = new WebSocket(`${wsUrl}/ws/${code}`);

        ws.onopen = () => log('WebSocket connected.');
        ws.onmessage = (e) => log(`Received: ${e.data}`, 'msg-received');
        ws.onclose = (e) => log(`Connection closed (code: ${e.code}, reason: ${e.reason})`, 'msg-error');
        ws.onerror = () => log('WebSocket error', 'msg-error');
    }

    function disconnectWS() {
        if (ws) { ws.close(); ws = null; }
    }

    function sendAction(type, data) {
        if (!ws || ws.readyState !== WebSocket.OPEN) { log('WebSocket is not connected.', 'msg-error'); return; }
        const msg = { type, ...data };
        ws.send(JSON.stringify(msg));
        log(`Sent: ${JSON.stringify(msg)}`, 'msg-sent');
    }

    function sendCustom() {
        if (!ws || ws.readyState !== WebSocket.OPEN) { log('WebSocket is not connected.', 'msg-error'); return; }
        const msg = document.getElementById('customMsg').value;
        ws.send(msg);
        log(`Sent: ${msg}`, 'msg-sent');
    }
</script>
</body>
</html>
